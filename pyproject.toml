[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opsharness"
version = "0.2.0"
description = "An agent harness that stays reliable across models and tools, with worlds that test it"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.entry-points."opsharness.worlds"]
toy = "opsharness.toy:ToyEnv"

[tool.setuptools]
packages = ["opsharness"]

[tool.setuptools.package-data]
opsharness = ["*.md"]
